[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methodica"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "nautilus-bridge>=0.6.0",
    "pandas>=2.3.3",
]

[tool.setuptools]
package-dir = { methodica = "." }
packages = [
    "methodica",
    "methodica.alpha_evaluator",
    "methodica.alpha_miner",
    "methodica.backtest",
    "methodica.common",
    "methodica.dsl",
]
