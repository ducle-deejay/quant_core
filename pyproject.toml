[tool.uv.workspace]
members = ["src/*"]
exclude = ["src/alpha-core"]

[tool.uv.sources]
market-data = { workspace = true }
nautilus-bridge = { workspace = true }
quantcore = { workspace = true }

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
    "uvloop>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/market_data/tests"]
markers = [
    "integration: full-catalog real-data runs (slower)",
]
