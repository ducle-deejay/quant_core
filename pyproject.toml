[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "quantcore"
version = "0.1.0"
description = "High-performance alpha research pipeline"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "TBD"}
authors = [{name = "research"}]

[tool.maturin]
python-source = "python"
manifest-path = "crates/alpha-core/Cargo.toml"
features = ["python-bindings"]
manifest-benches = false
