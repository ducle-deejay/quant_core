[tool.uv.workspace]
members = ["src/*"]
exclude = ["src/alpha-core"]

[tool.uv.sources]
core = { workspace = true }
market-data = { workspace = true }
strategy = { workspace = true }
trading = { workspace = true }
quantcore = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/market_data/tests"]
markers = [
    "integration: full-catalog real-data runs (slower)",
]
