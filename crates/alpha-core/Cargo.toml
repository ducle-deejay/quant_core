[package]
name = "alpha-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
default = []
python-bindings = ["dep:pyo3"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "batch-verify"
path = "src/bin/batch_verify.rs"

[[bin]]
name = "alphascreen"
path = "src/bin/alphascreen.rs"
